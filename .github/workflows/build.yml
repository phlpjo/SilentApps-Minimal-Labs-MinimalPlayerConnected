name: AAB und APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Passwort des Upload-Schlüssels – geheim ist der Schlüssel selbst (Secret KEYSTORE_B64). Repo bleibt privat.
      KEYSTORE_PASSWORD: "e63KBKrcDzxnXkYfwHf6MIDc"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Signierschlüssel
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secret KEYSTORE_B64 fehlt – unsignierter Testbuild."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bauen (AAB für Play + APK zum Testen)
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace bundleRelease assembleRelease 2>&1 | tee build.log

      # Bei Fehlern: Log in den Branch build-log (lässt sich ohne Actions-Zugriff lesen)
      - name: Build-Log sichern
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log 2>/dev/null || echo "kein Log" > /tmp/build.log
          git checkout --orphan build-log
          git rm -rfq . >/dev/null
          tail -c 200000 /tmp/build.log > build.log
          git add build.log
          git commit -qm "Build #${{ github.run_number }} fehlgeschlagen (${{ github.sha }})"
          git push -f origin build-log

      - name: Berechtigungen prüfen (nur erlaubte)
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          $AAPT dump permissions "$APK" | tee perms.txt
          ALLOWED="INTERNET CHANGE_WIFI_MULTICAST_STATE FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK WAKE_LOCK VIBRATE MODIFY_AUDIO_SETTINGS"
          for p in $(grep -oE "name='[^']+'" perms.txt | grep -oE "android\.permission\.[A-Z_]+" | sed 's/android.permission.//'); do
            echo " $ALLOWED " | grep -q " $p " || { echo "::error::Unerwartete Berechtigung: $p"; exit 1; }
          done

      - name: Dateien benennen
        run: |
          V="1.0.${{ github.run_number }}"
          S=$([ "${{ steps.key.outputs.signed }}" = "true" ] && echo "" || echo "-unsigniert")
          mkdir out
          cp app/build/outputs/bundle/release/app-release.aab "out/MinimalPlayerConnected-$V$S.aab"
          cp app/build/outputs/apk/release/*.apk "out/MinimalPlayerConnected-$V$S.apk"
          ls -la out

      # Nur als privates Workflow-Artefakt, keine öffentlichen Releases
      - uses: actions/upload-artifact@v4
        with:
          name: MinimalPlayerConnected-1.0.${{ github.run_number }}
          path: out/*
          retention-days: 30

      # Signierte Dateien zusätzlich in den privaten Branch „downloads“ (nur letzter Build, per git abrufbar)
      - name: In Branch downloads ablegen
        if: steps.key.outputs.signed == 'true'
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp out/* /tmp/
          git checkout --orphan downloads
          git rm -rfq . >/dev/null
          cp /tmp/MinimalPlayerConnected-* .
          git add MinimalPlayerConnected-*
          git commit -qm "Build #${{ github.run_number }}"
          git push -f origin downloads
